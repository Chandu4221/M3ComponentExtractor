name: Extract Compose Components

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle/**'
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 1' # Runs weekly on Monday at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Component Extractor
        run: ./gradlew run

      - name: Commit and push changes
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compose_components_*.json
          if git diff --staged --quiet; then
            echo "No changes detected in extracted components."
          else
            git commit -m "chore(schema): update compose components JSON [skip ci]"
            git push
          fi
